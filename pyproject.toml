[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viwikigraph"
version = "1.0.1"
description = "ViWikiGraph: a RAG-only video-to-wiki knowledge pipeline for video question answering (TVQA, KnowIT, NExT-QA)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kaibalya Bhuyan" }]
keywords = ["video-qa", "rag", "knowledge-graph", "multimodal", "retrieval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime is pure standard library. PyYAML is optional: when absent, configs are
# parsed by the built-in minimal YAML reader in viwikigraph.config.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7", "PyYAML>=6"]

[project.scripts]
viwikigraph = "viwikigraph.cli:main"
viwikigraph-eval = "complete_evaluation_core:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["viwikigraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
